name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Typecheck .forcey (platform dev tooling)
        run: npx tsc -p .forcey --noEmit
      - run: npm run lint
      - name: Component catalogue is current
        run: npm run catalogue:check
